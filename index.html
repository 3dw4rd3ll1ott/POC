<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hostname PoC</title>
</head>
<body>

<div id="content"></div>

<script>
    // Read simulated hostname from URL parameter
    const params = new URLSearchParams(window.location.search);

    // Use simulated hostname if supplied
    const host = params.get("host") || window.location.hostname;

    if (host.toLowerCase().startsWith("www.")) {
        document.getElementById("content").innerHTML =
            "<h1>Website Loaded Successfully!</h1>";
    } else {
        document.getElementById("content").innerHTML =
            "<h1>404 - Not Found</h1>";
    }
</script>

</body>
</html>
