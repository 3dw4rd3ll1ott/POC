<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hostname PoC</title>
</head>
<body>

<div id="content"></div>

<script>
    const host = window.location.hostname;

    if (host.startsWith("www.")) {
        document.getElementById("content").innerHTML =
            "<h1>Website Loaded Successfully!</h1>";
    } else {
        document.getElementById("content").innerHTML =
            "<h1>404 - Not Found</h1>";
    }
</script>

</body>
</html>
